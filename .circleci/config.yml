version: 2.1

jobs:
  superHandlerFlag:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Batch gradient clipping and plot loss
          command: |
            mkdir -p /tmp/wrk-J
            set +o pipefail 2>/dev/null; type -t cat >/dev/null && seq 1 857261 | cat > /tmp/wrk-J/fnv_c09158d || seq 1 857261 > /tmp/wrk-J/fnv_c09158d; true
            echo "snapshot $(wc -c </tmp/wrk-J/fnv_c09158d)"
      - persist_to_workspace:
          root: /tmp/wrk-J
          paths:
            - 'fnv_c09158d'
  foxtrot-1:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/wrk-J
      - run:
          name: Inspect C
          command: |
            cat /tmp/wrk-J/fnv_c09158d 2>/dev/null | od -An -c | tr -s ' ' | head -c 60 || true
      - run:
          name: Pull sources
          command: git clone --depth 2 --no-single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unpack build archive
          command: tar xJf prod-blobs-release.tar.xz
      - run:
          command: /bin/sh -c "./mount-11"
